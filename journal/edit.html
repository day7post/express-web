<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写日记 - 表达空间</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="brand">表达空间<small>ExpressSpace</small></a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="container-narrow">
    <div class="toolbar mt-24">
      <h2 id="page-title">写日记</h2>
      <a href="list.html" class="btn btn-ghost btn-sm">← 返回列表</a>
    </div>

    <div id="alert"></div>
    <div id="crisis"></div>

    <div class="card">
      <form id="journal-form" onsubmit="saveJournal(event)">
        <div class="field">
          <label>今天的心情怎么样？</label>
          <div class="mood-picker" id="mood-picker"></div>
        </div>

        <div class="field">
          <label>情绪标签（可多选）</label>
          <div id="mood-tags"></div>
        </div>

        <div class="field">
          <label>标题（可选）</label>
          <input type="text" id="title" maxlength="100" placeholder="给今天起个名字">
        </div>

        <div class="field">
          <label>写下想说的话…</label>
          <textarea id="content" rows="10" placeholder="无论开心还是难过，都可以写在这里。这里只属于你。" onblur="precheckContent(this.value, 'crisis')"></textarea>
          <div class="hint">仅你自己可见 · 内容已安全保存</div>
        </div>

        <div class="field">
          <label>自定义标签（逗号分隔，可选）</label>
          <input type="text" id="tags" placeholder="例如：工作, 家庭, 梦想">
        </div>

        <button type="submit" class="btn btn-block" id="save-btn">保 存</button>
      </form>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/safety.js"></script>
  <script>
    if (!requireLogin()) { /* 已跳转 */ }

    const MOOD_TAGS = ["平静", "开心", "焦虑", "难过", "愤怒", "疲惫", "孤独", "感激", "期待", "迷茫"];
    let editingId = null;
    let moodLevel = null;
    let selectedMoodTags = [];

    // 心情选择器
    document.getElementById("mood-picker").innerHTML = [1,2,3,4,5].map(l =>
      `<button type="button" class="mood-btn" data-level="${l}" onclick="pickMood(${l})">${moodEmoji(l)}</button>`
    ).join("");
    document.getElementById("mood-tags").innerHTML = MOOD_TAGS.map(t =>
      `<button type="button" class="mood-btn" data-tag="${t}" onclick="toggleMoodTag('${t}')">${t}</button>`
    ).join("");

    function pickMood(l) {
      moodLevel = l;
      document.querySelectorAll("#mood-picker .mood-btn").forEach(b =>
        b.classList.toggle("selected", parseInt(b.dataset.level) === l));
    }
    function toggleMoodTag(t) {
      const idx = selectedMoodTags.indexOf(t);
      if (idx >= 0) selectedMoodTags.splice(idx, 1);
      else selectedMoodTags.push(t);
      document.querySelectorAll("#mood-tags .mood-btn").forEach(b =>
        b.classList.toggle("selected", selectedMoodTags.includes(b.dataset.tag)));
    }

    // 编辑模式：加载已有日记
    async function loadExisting() {
      const params = new URLSearchParams(location.search);
      const id = params.get("id");
      if (!id) return;
      editingId = id;
      document.getElementById("page-title").textContent = "编辑日记";
      try {
        const j = await Api.get(`/journals/${id}`);
        document.getElementById("title").value = j.title || "";
        document.getElementById("content").value = j.content;
        document.getElementById("tags").value = (j.tags || []).join(", ");
        if (j.mood_level) pickMood(j.mood_level);
        (j.mood_tags || []).forEach(t => toggleMoodTag(t));
      } catch (e) {
        showError(document.getElementById("alert"), e.detail);
      }
    }

    async function saveJournal(e) {
      e.preventDefault();
      clearAlert(document.getElementById("alert"));
      const body = {
        title: document.getElementById("title").value.trim() || null,
        content: document.getElementById("content").value.trim(),
        mood_level: moodLevel,
        mood_tags: selectedMoodTags.length ? selectedMoodTags : null,
        tags: document.getElementById("tags").value.split(/[,，]/).map(s => s.trim()).filter(Boolean) || null,
      };
      if (!body.content) { showError(document.getElementById("alert"), "写点什么再保存吧"); return; }

      // 先做内容预检（危机词提示 + 敏感词拦截）
      try {
        const check = await Api.post("/content/check", { text: body.content, source: "journal" });
        if (check.action === "warn" && !document.getElementById("crisis").querySelector(".crisis-card")) {
          document.getElementById("crisis").insertAdjacentHTML("afterbegin", renderCrisisCard());
        }
      } catch (e) {
        showError(document.getElementById("alert"), e.detail);
        return;
      }

      const btn = document.getElementById("save-btn");
      btn.disabled = true; btn.textContent = "保存中…";
      try {
        if (editingId) await Api.put(`/journals/${editingId}`, body);
        else await Api.post("/journals", body);
        location.href = "list.html";
      } catch (e) {
        showError(document.getElementById("alert"), e.detail);
        btn.disabled = false; btn.textContent = "保 存";
      }
    }

    loadExisting();
  </script>
</body>
</html>
