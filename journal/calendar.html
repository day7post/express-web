<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心情日历 - 表达空间</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="brand">表达空间<small>ExpressSpace</small></a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="container-narrow">
    <div class="toolbar mt-24">
      <h2>心情日历</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(-1)">← 上月</button>
        <span id="month-label" style="min-width:90px;text-align:center;font-weight:600"></span>
        <button class="btn btn-ghost btn-sm" onclick="changeMonth(1)">下月 →</button>
      </div>
    </div>
    <p class="text-faint mb-16" style="font-size:13px">颜色越暖，那天的心情越好；点击某天可以写日记</p>

    <div class="card">
      <div id="weekdays" class="calendar-grid mb-8"></div>
      <div id="calendar" class="calendar-grid"></div>
    </div>
    <div id="alert"></div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    if (!requireLogin()) { /* 已跳转 */ }

    let year = new Date().getFullYear();
    let month = new Date().getMonth() + 1;

    const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
    document.getElementById("weekdays").innerHTML = WEEKDAYS.map(d => `<div class="text-center text-faint" style="font-size:12px">${d}</div>`).join("");

    function moodColor(avg) {
      if (avg == null) return "";
      if (avg >= 4.5) return "#7fb5a0";   // 很开心
      if (avg >= 3.5) return "#a8c3d9";   // 不错
      if (avg >= 2.5) return "#d9c9a8";   // 一般
      if (avg >= 1.5) return "#e0b3a8";   // 有点低落
      return "#d9897f";                   // 难过
    }

    async function loadCalendar() {
      document.getElementById("month-label").textContent = `${year} 年 ${month} 月`;
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

      let moodMap = {};
      try {
        const data = await Api.get(`/journals/calendar?year=${year}&month=${month}`);
        data.items.forEach(it => { moodMap[it.date] = it.avg_mood; });
      } catch (e) { /* 空日历也能显示 */ }

      const firstDay = new Date(year, month - 1, 1);
      const startWeekday = firstDay.getDay();
      const daysInMonth = new Date(year, month, 0).getDate();

      let html = "";
      for (let i = 0; i < startWeekday; i++) html += `<div class="cal-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const avg = moodMap[dateStr];
        const color = moodColor(avg);
        const isToday = dateStr === todayStr;
        html += `<div class="cal-day ${isToday ? "today" : ""}" onclick="location.href='edit.html'"
          title="${dateStr}${avg != null ? " 心情 " + avg : ""}">
          ${d}${avg != null ? `<span class="mood-dot" style="background:${color}"></span>` : ""}
        </div>`;
      }
      document.getElementById("calendar").innerHTML = html;
    }

    function changeMonth(delta) {
      month += delta;
      if (month < 1) { month = 12; year--; }
      if (month > 12) { month = 1; year++; }
      loadCalendar();
    }

    loadCalendar();
  </script>
</body>
</html>
