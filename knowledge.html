<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>心理知识库 - 语滞</title>
  <meta name="description" content="语滞心理知识库：了解焦虑、难过、愤怒、孤独、压力等情绪的成因，学会与自己相处。">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="index.html" class="brand">语滞<small>Yuzhi</small></a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="container">
    <div class="toolbar mt-24">
      <h2>📚 心理知识库</h2>
      <a href="safety.html" class="btn btn-ghost btn-sm">← 心理资源</a>
    </div>
    <p class="text-soft mb-16" style="font-size:14px">
      每一种心情都不是无缘无故的。这里帮你了解：<strong>这是什么 → 为什么会这样 → 可以怎么办 → 何时需要帮助</strong>。
    </p>

    <!-- 分类筛选 -->
    <div class="category-tabs" id="category-tabs"></div>

    <!-- 主题卡片 -->
    <div id="topic-list" class="loading">加载中…</div>

    <!-- 详情弹层 -->
    <div id="detail-modal" style="display:none">
      <div style="position:fixed;inset:0;background:rgba(61,74,67,0.5);z-index:1000" onclick="closeDetail()"></div>
      <div style="position:fixed;top:8%;left:50%;transform:translateX(-50%);width:min(640px,92vw);max-height:84vh;overflow-y:auto;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-lg);z-index:1001;padding:28px" id="detail-content"></div>
    </div>
  </main>

  <div class="disclaimer container mt-8" style="max-width:920px">
    <strong>重要说明：</strong>本知识库为心理教育科普内容，帮助理解情绪，<strong>不构成医疗诊断或治疗建议</strong>。
    如你正经历情绪危机或持续困扰，请拨打心理援助热线 <strong>12356</strong>，或寻求专业帮助。<a href="safety.html">查看全部心理资源 →</a>
  </div>

  <footer class="footer">
    <p><a href="privacy.html">隐私政策</a> · <a href="safety.html">心理资源</a></p>
    <p class="mt-8">语滞 Yuzhi · 愿你的声音被听见</p>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/knowledge.js"></script>
  <script>
    let currentCategory = "全部";

    function renderTabs() {
      document.getElementById("category-tabs").innerHTML = KNOWLEDGE_CATEGORIES.map(c =>
        `<span class="tab ${c === currentCategory ? "active" : ""}" onclick="selectCategory('${c}', this)">${c}</span>`
      ).join("");
    }

    function selectCategory(cat, el) {
      currentCategory = cat;
      document.querySelectorAll(".category-tabs .tab").forEach(t => t.classList.remove("active"));
      if (el) el.classList.add("active");
      renderList();
    }

    function renderList() {
      const list = document.getElementById("topic-list");
      const topics = currentCategory === "全部"
        ? KNOWLEDGE_TOPICS
        : KNOWLEDGE_TOPICS.filter(t => t.category === currentCategory);

      if (!topics.length) {
        list.innerHTML = `<div class="empty"><div class="emoji">📭</div><p>该分类暂无内容</p></div>`;
        return;
      }

      list.innerHTML = topics.map(t => `
        <div class="post-card" style="cursor:pointer" onclick="openDetail('${t.id}')">
          <div style="display:flex;align-items:flex-start;gap:14px">
            <div style="font-size:34px;line-height:1">${t.emoji}</div>
            <div style="flex:1">
              <div class="item-title">${t.title}</div>
              <div class="mt-8" style="margin-bottom:6px">${t.category && `<span class="tag-chip">${t.category}</span>`}</div>
              <div class="item-content">${t.summary}</div>
            </div>
          </div>
        </div>`).join("");
    }

    function openDetail(id) {
      const t = KNOWLEDGE_TOPICS.find(x => x.id === id);
      if (!t) return;

      const listHtml = (arr, icon) => arr.map(item =>
        `<li style="margin-bottom:8px;color:var(--text-soft);font-size:14px">${icon} ${item}</li>`).join("");

      document.getElementById("detail-content").innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">
          <h2 style="font-size:20px">${t.emoji} ${t.title}</h2>
          <button class="btn btn-ghost btn-sm" onclick="closeDetail()">关闭 ✕</button>
        </div>
        <p class="text-soft mb-16" style="font-size:14px">${t.summary}</p>

        <h3 style="font-size:16px;color:var(--primary-deep);margin:16px 0 8px">🔍 这是什么</h3>
        <p style="font-size:14px;color:var(--text);line-height:1.9">${t.what}</p>

        <h3 style="font-size:16px;color:var(--primary-deep);margin:16px 0 8px">🧠 为什么会这样</h3>
        <ul style="padding-left:20px">${listHtml(t.why, "·")}</ul>

        <h3 style="font-size:16px;color:var(--primary-deep);margin:16px 0 8px">🌱 可以怎么办</h3>
        <ul style="padding-left:20px">${listHtml(t.how, "✓")}</ul>

        <h3 style="font-size:16px;color:var(--warn);margin:16px 0 8px">🆘 何时需要帮助</h3>
        <div class="crisis-card" style="margin-bottom:0">
          <p style="font-size:14px;line-height:1.9;margin-bottom:8px">${t.help}</p>
          <p style="font-size:13px;color:var(--text-faint)">全国统一心理援助热线：<strong style="color:var(--warn)">12356</strong> · 希望24热线：<strong style="color:var(--warn)">400-161-9995</strong></p>
        </div>
      `;
      document.getElementById("detail-modal").style.display = "";
      document.body.style.overflow = "hidden";
    }

    function closeDetail() {
      document.getElementById("detail-modal").style.display = "none";
      document.body.style.overflow = "";
    }

    // 键盘 Esc 关闭
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

    renderTabs();
    renderList();
  </script>
</body>
</html>
