<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>写信助手 - 表达空间</title>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/common.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="../index.html" class="brand">表达空间<small>ExpressSpace</small></a>
      <nav class="nav" data-nav></nav>
    </div>
  </header>

  <main class="container-narrow">
    <div class="toolbar mt-24">
      <h2>写信助手</h2>
      <a href="hub.html" class="btn btn-ghost btn-sm">← 创作中心</a>
    </div>
    <p class="text-soft mb-16" style="font-size:14px">把想说的话整理成一封真诚的信。填好下面几个问题，帮你搭出草稿框架，剩下的交给你润色。</p>

    <div id="alert"></div>

    <div class="card">
      <div class="field">
        <label>收信人（TA 是谁）</label>
        <input type="text" id="rel" placeholder="例如：三年没联系的好朋友、总是骂我的爸爸">
      </div>
      <div class="field">
        <label>这封信想说什么（1-3 个要点）</label>
        <textarea id="points" rows="3" placeholder="例如：① 当年那件事一直想说对不起 ② 其实我很感激你 ③ 希望还能像从前一样"></textarea>
      </div>
      <div class="field">
        <label>语气</label>
        <div class="mood-picker" id="tone-picker">
          <button type="button" class="mood-btn" data-tone="温柔" onclick="pickTone('温柔')">温柔</button>
          <button type="button" class="mood-btn" data-tone="诚恳" onclick="pickTone('诚恳')">诚恳</button>
          <button type="button" class="mood-btn" data-tone="直接" onclick="pickTone('直接')">直接</button>
        </div>
      </div>
      <button class="btn btn-block" onclick="composeLetter()">生成信件草稿</button>
    </div>

    <div class="card" id="result-area" style="display:none">
      <h3 class="card-title">信件草稿</h3>
      <div class="result-box" id="result-box"></div>
      <div class="mt-16" style="display:flex;gap:10px">
        <button class="btn" onclick="copyLetter()">复制</button>
        <button class="btn btn-ghost" onclick="saveLetter()">保存到我的作品</button>
        <button class="btn btn-ghost" onclick="location.reload()">重新填写</button>
      </div>
    </div>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script>
    let letterText = "";
    let selectedTone = "温柔";

    function pickTone(t) {
      selectedTone = t;
      document.querySelectorAll("#tone-picker .mood-btn").forEach(b => b.classList.toggle("selected", b.dataset.tone === t));
    }

    const TONE_OPENINGS = {
      "温柔": "见信如晤。",
      "诚恳": "你好。有些话想了很久，决定写下来。",
      "直接": "写这封信，是想把憋了很久的话说清楚。",
    };
    const TONE_CLOSINGS = {
      "温柔": "愿你一切都好。\n\n—— 一个认真想过你、也认真想过我们的人",
      "诚恳": "谢谢你能看到这里。\n\n—— 真心希望我们之间还能有话可说的人",
      "直接": "这就是我最真实的想法。\n\n—— 一个决定不再沉默的人",
    };

    function composeLetter() {
      const rel = document.getElementById("rel").value.trim() || "你";
      const pointsRaw = document.getElementById("points").value.trim();
      const points = pointsRaw.split(/\n|①|②|③|④|1[\.、]|2[\.、]|3[\.、]/).map(s => s.replace(/^\s*[\)）]?\s*/, "").trim()).filter(Boolean);

      const body = points.length
        ? points.map((p, i) => `${["一","二","三","四"][i] || i+1}、${p}`).join("\n")
        : "想说的话在心里翻来覆去，落笔时却不知从何说起。";

      letterText = `${rel}：\n\n${TONE_OPENINGS[selectedTone]}\n\n${body}\n\n${TONE_CLOSINGS[selectedTone]}`;

      document.getElementById("result-box").textContent = letterText;
      document.getElementById("result-area").style.display = "";
      document.getElementById("result-area").scrollIntoView({ behavior: "smooth" });
    }

    function copyLetter() {
      navigator.clipboard.writeText(letterText).then(() => alert("已复制 💌"));
    }

    async function saveLetter() {
      if (!Api.isLoggedIn()) { location.href = "../auth.html"; return; }
      try {
        await Api.post("/creations", {
          tool_type: "letter",
          title: "一封信",
          content: letterText,
          raw_input: {},
        });
        alert("已保存到我的作品 📂");
      } catch (e) { showError(document.getElementById("alert"), e.detail); }
    }
  </script>
</body>
</html>
